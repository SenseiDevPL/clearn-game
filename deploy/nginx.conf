server {
    listen 80;
    root /usr/share/nginx/html;

    # Page itself: always ask the server for the newest version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    # Built files have a content hash in the name, safe to keep forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
